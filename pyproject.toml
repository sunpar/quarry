[project]
name = "quarry"
version = "0.1.0"
description = "Agentic data exploration for quant researchers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "polars>=1.0",
    "duckdb>=1.0",
    "pydantic>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
mssql = ["arrow-odbc>=10"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quarry"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "RUF"]
ignore = ["ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["quarry"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["arrow_odbc", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true
