name: Claude Code Review
on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to review
        required: true
        type: string
jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - name: Checkout review tools from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Resolve requested pull request
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pull_request }}
        run: |
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          number=$(gh pr view "$PR_NUMBER" --json number --jq .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"
      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt:
            "/code-review:code-review --comment ${{ github.repository
            }}/pull/${{ steps.pr.outputs.number }}"
          claude_args:
            '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
