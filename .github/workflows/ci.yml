name: ci
on:
  workflow_dispatch:
    inputs:
      suite:
        description: Verification suite
        type: choice
        options: [full, smoke, coverage]
        default: full
      runner:
        description:
          Linux includes kernel memory-cap coverage unavailable on macOS
        type: choice
        options: [ubuntu-latest, macos-latest]
        default: ubuntu-latest
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # setup-uv publishes no major tags since v8, so it is pinned to a release.
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make deps
      - name: Run shared local verification
        env:
          SUITE: ${{ inputs.suite }}
        run: node scripts/local-checks.mjs "$SUITE"
      - name: Upload branch coverage
        if: inputs.suite == 'coverage' && always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ inputs.runner }}
          path: coverage.xml
          if-no-files-found: error
